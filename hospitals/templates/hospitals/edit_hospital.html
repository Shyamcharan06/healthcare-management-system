{% extends "base.html" %}
{% load widget_tweaks %}
{% block title %}Edit Hospital{% endblock %}
{% block content %}
<h3 class="mb-4">Edit {{ hospital.name }}</h3>
<div class="card p-4" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {% render_field field class="form-control" %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'hospitals:manage' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}

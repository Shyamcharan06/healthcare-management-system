{% extends "base.html" %}
{% block title %}Assign Doctors{% endblock %}
{% block content %}
<h3 class="mb-4">Assign Doctors to Hospital / Department</h3>
<div class="card p-4" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Doctor</label>
            <select name="doctor_id" class="form-select" required>
                {% for doctor in doctors %}
                    <option value="{{ doctor.pk }}">Dr. {{ doctor.name }} (currently: {{ doctor.hospital|default:"none" }} / {{ doctor.department|default:"none" }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Hospital</label>
            <select name="hospital_id" class="form-select">
                <option value="">-- none --</option>
                {% for hospital in hospitals %}
                    <option value="{{ hospital.pk }}">{{ hospital.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select name="department_id" class="form-select">
                <option value="">-- none --</option>
                {% for hospital in hospitals %}
                    {% for department in hospital.departments.all %}
                        <option value="{{ department.pk }}">{{ hospital.name }} - {{ department.name }}</option>
                    {% endfor %}
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Assign</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% load widget_tweaks %}
{% block title %}Add Consultation Note{% endblock %}
{% block content %}
<h3 class="mb-4">Add Consultation Note for {{ patient.name }}</h3>
<div class="card p-4" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {% render_field field class="form-control" %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Note</button>
    </form>
</div>
{% endblock %}
